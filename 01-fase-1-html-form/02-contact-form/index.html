<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form - HTML Form & Validation</title>
  </head>
  <body>
    <main>
      <section>
        <h1>Hubungi Kami</h1>
        <p>Silahkan isi formulir dibawah ini untuk mengirim pesan kepada kami.</p>

        <form action="#" method="POST">
          <!-- Elemen input bakal kita isi di commit berikutnya -->
        </form>

        <!-- INPUT NAMA LENGKAP -->
        <div>
          <label for="full-name">Nama Lengkap:</label>
          <input type="text" id="full-name" name="full_name" placeholder="Contoh: Fauzan Fauzi" required minlength="3" />
        </div>

        <!-- INPUT EMAIL -->
        <div>
          <label for="email">Alamat Email:</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required />
        </div>
      </section>
    </main>
  </body>
</html>
