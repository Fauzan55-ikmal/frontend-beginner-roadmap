<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Comparison Table - HTML Semantic Table</title>
  </head>
  <body>
    <main>
      <section>
        <h1>Perbandingan Paket Layanan</h1>
        <p>Pilih paket yang paling sesuai dengan kebutuhan proyek Anda.</p>

        <table>
          <caption>
            Tabel Perbandingan Fitur Paket Hosting & Domain
          </caption>

          <!-- HEADER TABEL (NAMA PAKET & HARGA) -->
          <thead>
            <tr>
              <th scope="col">Fitur Layanan</th>
              <th scope="col">Paket Starter</th>
              <th scope="col">Paket Pro</th>
              <th scope="col">Paket Enterprise</th>
            </tr>
          </thead>
        </table>
      </section>
    </main>
  </body>
</html>
