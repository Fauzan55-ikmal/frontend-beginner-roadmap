<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tooltip UI Component - CSS Positioning</title>

    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <!-- HEADER HALAMAN -->
      <header class="header">
        <h1>Tooltip UI Component</h1>
        <p>Eksplorasi CSS Positioning dengan <code>position: relative</code> dan <code>position: absolute</code>.</p>
      </header>

      <!-- KONTEN DEMO TOOLTIP -->
      <section class="demo-area">
        <div class="tooltip-wrapper" data-tooltip="Simpan perubahan profil Anda">
          <button class="btn">Simpan Profil</button>
        </div>
      </section>
    </main>
  </body>
</html>
