<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restricted Textarea - Character Counter</title>

    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <header class="card-header">
          <h2>Ulasan Produk</h2>
          <p>Bagikan pendapatmu mengenai produk ini (maksimal 200 karakter).</p>
        </header>

        <form class="feedback-form" id="feedbackForm">
          <div class="input-group">
            <label for="message">Pesan / Ulasan</label>
            <textarea id="message" name="message" placeholder="Tulis ulasanmu di sini..." maxlength="200" rows="5"></textarea>

            <div class="counter-wrapper">
              <span id="charCount" class="counter">0 / 200 karakter</span>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn">Kirim Ulasan</button>
        </form>
      </div>
    </main>

    <!-- JavaScript di-load menggunakan defer agar DOM terurai penuh dulu -->
    <script src="script.js" defer></script>
  </body>
</html>
