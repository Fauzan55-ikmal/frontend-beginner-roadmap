<!doctype html>
<html lang="id">
  <head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Smart Text & Log Formatter - Utility Tool</title>

    <!-- SEO & Search Engine Metadata -->
    <meta name="description" content="Alat pembersih format teks dan penyamar data sensitif (redaction) instan untuk tim support dan software developer." />
    <meta name="keywords" content="text formatter, log cleaner, redact sensitive data, privacy tool, developer utility" />
    <meta name="author" content="Fauzan Fauzia Fauzi" />

    <!-- Open Graph / Social Media Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smart Text & Log Formatter" />
    <meta property="og:description" content="Pembersih teks dan log error serta penyamar data sensitif instan tanpa server-side logging." />

    <!-- External Fonts (Inter & JetBrains Mono for Code/Log) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Stylesheet Link -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header Utama -->
      <header class="app-header">
        <h1>Smart Text & Log Formatter</h1>
        <p>Alat pembersih format teks dan penyamar data sensitif instan untuk tim support & dev.</p>
      </header>

      <!-- Area Workspace Utama (Tempat Panel Input & Output Disuntikkan) -->
      <main class="workspace" id="workspace-container">
        <!-- Area Workspace Utama -->
        <main class="workspace" id="workspace-container">
          <!-- Panel Kiri: Input Teks Mentah -->
          <section class="panel panel-input" aria-labelledby="input-panel-title">
            <div class="panel-header">
              <h2 id="input-panel-title">Teks / Log Mentah</h2>
              <span class="char-counter" id="input-char-count">0 Karakter</span>
            </div>

            <div class="panel-body">
              <label for="input-text" class="visually-hidden">Area Teks Input</label>
              <textarea id="input-text" class="text-area" placeholder="Paste teks berantakan, email mentah, atau log error di sini..." spellcheck="false" autocomplete="off"></textarea>
            </div>

            <div class="panel-footer">
              <button id="btn-clean" class="btn btn-primary" type="button"><span class="btn-icon">🧹</span> Bersihkan Format</button>
              <button id="btn-redact" class="btn btn-warning" type="button"><span class="btn-icon">🔒</span> Redact Data Sensitif</button>
              <button id="btn-clear" class="btn btn-ghost" type="button"><span class="btn-icon">🗑️</span> Hapus Teks</button>
            </div>
          </section>
        </main>
      </main>
    </div>

    <!-- Main JavaScript Logic -->
    <script src="script.js"></script>
  </body>
</html>
