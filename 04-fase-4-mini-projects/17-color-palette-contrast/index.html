<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Color Palette Generator & WCAG Contrast Checker - Alat pembuat palet warna harmonis dan penguji rasio kontras aksesibilitas web instan." />
    <title>Color Palette Generator & WCAG Contrast Checker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header Aplikasi -->
      <header class="app-header">
        <h1>Color Palette & Contrast Checker</h1>
        <p>Generate kombinasi warna harmonis, konversi format, dan uji rasio kontras standar WCAG 2.1.</p>
      </header>

      <!-- Main Workspace -->
      <main class="workspace" id="workspace-container">
        <!-- Section Palette Generator & WCAG Checker akan disuntikkan di tahap berikutnya -->
        <!-- Control Toolbar -->
        <section class="toolbar-section">
          <div class="toolbar-controls">
            <button id="btn-generate" class="btn btn-primary"><span class="btn-icon">🎲</span> Generate Palet (Spacebar)</button>
            <div class="select-group">
              <label for="format-select">Format Warna:</label>
              <select id="format-select" class="select-control">
                <option value="hex">HEX (#RRGGBB)</option>
                <option value="rgb">RGB (r, g, b)</option>
                <option value="hsl">HSL (h, s%, l%)</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Palette Grid Display (5 Warna) -->
        <section class="palette-grid" id="palette-grid">
          <!-- Kartu Warna 1 -->
          <article class="color-card" data-index="0">
            <div class="color-preview" style="background-color: #3b82f6">
              <button class="btn-lock" title="Kunci Warna" aria-label="Kunci Warna">
                <span class="lock-icon">🔓</span>
              </button>
            </div>
            <div class="color-info">
              <span class="color-code">#3B82F6</span>
              <button class="btn-copy-card" title="Salin Kode Warna">
                <span class="btn-icon">📋</span>
              </button>
            </div>
          </article>

          <!-- Kartu Warna 2 -->
          <article class="color-card" data-index="1">
            <div class="color-preview" style="background-color: #10b981">
              <button class="btn-lock" title="Kunci Warna" aria-label="Kunci Warna">
                <span class="lock-icon">🔓</span>
              </button>
            </div>
            <div class="color-info">
              <span class="color-code">#10B981</span>
              <button class="btn-copy-card" title="Salin Kode Warna">
                <span class="btn-icon">📋</span>
              </button>
            </div>
          </article>

          <!-- Kartu Warna 3 -->
          <article class="color-card" data-index="2">
            <div class="color-preview" style="background-color: #f59e0b">
              <button class="btn-lock" title="Kunci Warna" aria-label="Kunci Warna">
                <span class="lock-icon">🔓</span>
              </button>
            </div>
            <div class="color-info">
              <span class="color-code">#F59E0B</span>
              <button class="btn-copy-card" title="Salin Kode Warna">
                <span class="btn-icon">📋</span>
              </button>
            </div>
          </article>

          <!-- Kartu Warna 4 -->
          <article class="color-card" data-index="3">
            <div class="color-preview" style="background-color: #ef4444">
              <button class="btn-lock" title="Kunci Warna" aria-label="Kunci Warna">
                <span class="lock-icon">🔓</span>
              </button>
            </div>
            <div class="color-info">
              <span class="color-code">#EF4444</span>
              <button class="btn-copy-card" title="Salin Kode Warna">
                <span class="btn-icon">📋</span>
              </button>
            </div>
          </article>

          <!-- Kartu Warna 5 -->
          <article class="color-card" data-index="4">
            <div class="color-preview" style="background-color: #8b5cf6">
              <button class="btn-lock" title="Kunci Warna" aria-label="Kunci Warna">
                <span class="lock-icon">🔓</span>
              </button>
            </div>
            <div class="color-info">
              <span class="color-code">#8B5CF6</span>
              <button class="btn-copy-card" title="Salin Kode Warna">
                <span class="btn-icon">📋</span>
              </button>
            </div>
          </article>
        </section>
      </main>
    </div>

    <!-- Custom JS Script -->
    <script src="script.js"></script>
  </body>
</html>
