<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Kanban Engine - Task Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header Utama Aplikasi -->
      <header class="app-header">
        <div class="header-brand">
          <h1>📋 Enterprise Kanban Engine</h1>
          <span class="status-indicator" id="storage-status" title="Status Sinkronisasi Storage"> <span class="dot"></span> Saved </span>
        </div>
        <p class="header-subtitle">Interactive Task Management with Native DnD, History Buffer, & Accessibility</p>
      </header>

      <!-- Area Kerja Utama (Control Bar & Board Container akan masuk di sini) -->
      <main class="workspace" id="workspace">
        <!-- Control Bar: Search, Filter, History, & Actions -->
        <section class="control-bar">
          <div class="control-left">
            <!-- Global Search Input -->
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input type="text" id="search-input" placeholder="Cari tugas..." aria-label="Cari tugas" />
            </div>

            <!-- Priority Filter Dropdown -->
            <div class="filter-group">
              <label for="filter-priority">Prioritas:</label>
              <select id="filter-priority" class="select-control">
                <option value="all">Semua</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
          </div>

          <div class="control-right">
            <!-- History Controls (Undo / Redo) -->
            <div class="history-actions">
              <button id="btn-undo" class="btn btn-secondary" title="Undo (Ctrl+Z)" disabled><span>↺</span> Undo</button>
              <button id="btn-redo" class="btn btn-secondary" title="Redo (Ctrl+Y)" disabled><span>↻</span> Redo</button>
            </div>

            <!-- Add Column Action -->
            <button id="btn-add-column" class="btn btn-primary"><span>+</span> Tambah Kolom</button>
          </div>
        </section>

        <!-- Board Container (Poin 3 - TAMBAHKAN DI SINI) -->
        <section class="board-container" id="board-container">
          <!-- Kolom-kolom dan kartu akan di-render secara dinamis via JavaScript -->
        </section>
      </main>

      <!-- Modal Dialog: Create / Edit Task -->
      <div class="modal-backdrop" id="modal-task" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-labelledby="modal-title">
          <div class="modal-header">
            <h3 id="modal-title">Tambah Tugas Baru</h3>
            <button id="btn-close-modal" class="btn-close" aria-label="Tutup Modal">&times;</button>
          </div>
          <form id="task-form" class="modal-body">
            <input type="hidden" id="task-id" />
            <input type="hidden" id="task-column-id" />

            <div class="form-group">
              <label for="task-title-input">Judul Tugas <span class="required">*</span></label>
              <input type="text" id="task-title-input" class="form-control" placeholder="Contoh: Refactor CSS Architecture" required />
            </div>

            <div class="form-group">
              <label for="task-desc-input">Deskripsi</label>
              <textarea id="task-desc-input" class="form-control" rows="3" placeholder="Rincian detail tugas..."></textarea>
            </div>

            <div class="form-group">
              <label for="task-priority-input">Prioritas</label>
              <select id="task-priority-input" class="form-control">
                <option value="low">Low (Hijau)</option>
                <option value="medium" selected>Medium (Kuning)</option>
                <option value="high">High (Merah)</option>
              </select>
            </div>

            <div class="modal-footer">
              <button type="button" id="btn-cancel-task" class="btn btn-secondary">Batal</button>
              <button type="submit" class="btn btn-primary">Simpan Tugas</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
